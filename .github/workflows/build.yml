name: Build a site video

on:
  schedule:
    # One a day. Eight trades and five backdrops: more often than this and the
    # rotation repeats itself faster than anyone forgets the last one.
    #
    # 08:23, not 09:00. GitHub's scheduler queues every repo asking for the top
    # of the hour and drops or delays what it cannot fit: the sibling clipping
    # repo asks for 14:00 and has been starting at 17:30. An odd minute off the
    # hour is the standard mitigation. Expect drift regardless; this is a daily
    # build, not a cron job anyone is waiting on.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      trade:
        description: "Trade to build for (blank = a fresh one)"
        required: false
        default: ""
      seconds:
        description: "Scroll duration"
        required: false
        default: "12"
      post:
        description: "Upload to TikTok drafts when done"
        type: boolean
        required: false
        default: true
      refine:
        description: "Second pass that reviews its own scroll (doubles the run)"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # the Persist state step commits state.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install playwright requests

      - name: Install ffmpeg
        # Not on the ubuntu-24.04 runner image. compose.py shells out to it and
        # the first CI run died on FileNotFoundError 36 minutes in, after the
        # whole page had been built and recorded twice.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check what the runner actually has
        run: |
          # command -v, not `tool --version | head -1`: in a pipeline the exit
          # status is the LAST command's, so `ffmpeg -version | head -1 || exit 1`
          # reported success while ffmpeg was absent. That is exactly how the
          # missing ffmpeg got past this step the first time.
          command -v google-chrome >/dev/null || { echo "::error::no Chrome"; exit 1; }
          command -v ffmpeg >/dev/null || { echo "::error::no ffmpeg"; exit 1; }
          google-chrome --version
          ffmpeg -version 2>&1 | head -1

      - name: Prove WebGL works headless
        run: |
          # No GPU here, so the backdrops rely on SwiftShader. If this prints
          # anything other than a real renderer, every video is a black frame
          # and it is better to know now.
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(channel="chrome", args=[
                  "--use-gl=angle", "--use-angle=swiftshader",
                  "--enable-unsafe-swiftshader"])
              pg = b.new_page()
              info = pg.evaluate("""() => {
                  const c = document.createElement('canvas');
                  const gl = c.getContext('webgl');
                  if (!gl) return 'NO WEBGL';
                  const d = gl.getExtension('WEBGL_debug_renderer_info');
                  return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'webgl, renderer unknown';
              }""")
              print("renderer:", info)
              b.close()
              if info == "NO WEBGL":
                  raise SystemExit("::error::no WebGL on this runner")
          PY

      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          # inputs are empty on a schedule, so everything below has a default.
          if [ -n "${{ github.event.inputs.trade }}" ]; then
            ARGS="--trade '${{ github.event.inputs.trade }}'"
          fi
          # Recording is the slow step here -- SwiftShader has no GPU behind it
          # and the refine pass records the page a second time. 36 minutes of
          # the first run was those two passes.
          # Refine is ON by default now, including on the schedule: it edits
          # the plan and re-records, which is the pass that catches a dead
          # stretch or a panel nobody can read.
          if [ "${{ github.event.inputs.refine }}" = "false" ]; then
            ARGS="$ARGS --no-refine"
          fi
          SECS="${{ github.event.inputs.seconds }}"
          eval python -u main.py $ARGS --seconds "${SECS:-12}"

      - name: Upload the video and the site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: |
            out/*/video.mp4
            out/*/page.html
            out/*/scene.html
            out/*/meta.json
          if-no-files-found: warn

      - name: Upload to TikTok drafts
        # Default true, and on a schedule inputs are empty -- so a cron run
        # posts. It lands in the TikTok app's drafts, never public: post.py has
        # no publish path at all, so the worst case is a draft nobody wants.
        if: ${{ github.event.inputs.post != 'false' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_CODEAZ: ${{ secrets.TIKTOK_REFRESH_TOKEN_CODEAZ }}
        run: |
          DIR=$(ls -td out/*/ | head -1)
          echo "posting $DIR"
          python post.py "$DIR" --yes

      - name: Persist state
        if: success()
        run: |
          # state.json is what stops the next run repeating a trade, a
          # component or a backdrop.
          git config user.name "scrollreel-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: build $(date -u +%F_%H:%M)"
          git push || echo "push failed (non-fatal)"
