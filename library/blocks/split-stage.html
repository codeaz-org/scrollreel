<!--{"kind": "panel", "device": "pin", "what": "One photograph held still while the words beside it change. The image pins, the copy advances: the clearest way to walk through three points without three sections.", "slots": {"img": "img path", "items": "list of exactly 3 objects: {head: 3-6 words, body: one or two sentences}"}}-->
<section data-sc-act="pin" data-sc-span="2.8">
  <div data-sc-stage class="panel b-split">
    <div class="b-split-grid">
      <div class="b-split-media"><img src="{{img}}" alt=""></div>
      <div class="b-split-steps">
        <div class="b-split-step" data-sc-cue="0 0.36 0">
          <h3>{{items.0.head}}</h3><p>{{items.0.body}}</p>
        </div>
        <div class="b-split-step" data-sc-cue="0.32 0.68">
          <h3>{{items.1.head}}</h3><p>{{items.1.body}}</p>
        </div>
        <div class="b-split-step" data-sc-cue="0.64 1">
          <h3>{{items.2.head}}</h3><p>{{items.2.body}}</p>
        </div>
      </div>
    </div>
  </div>
</section>
<style>
/* Cue windows overlap by about 15% on purpose: the outgoing line is still
   fading as the next arrives, so the reader never faces an empty stage. The
   first cue uses the greet form (third value 0) because a pinned stage is
   fully visible a viewport before its own progress leaves 0. */
.b-split{min-height:74vh;display:flex;align-items:center}
.b-split-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;width:100%}
.b-split-media{border-radius:calc(var(--radius) * .7);overflow:hidden}
.b-split-media img{width:100%;height:54vh;object-fit:cover;border-radius:0}
.b-split-steps{position:relative;min-height:44vh}
.b-split-step{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
@media(max-width:760px){.b-split-grid{grid-template-columns:1fr}
  .b-split-steps{position:static;min-height:0}
  .b-split-step{position:static;padding:4vh 0}}
</style>
