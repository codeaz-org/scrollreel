<!--{"kind": "panel", "device": "reveal", "what": "A photograph of the finished thing wiped away to a labelled drawing of what is underneath it. The single most convincing block for any trade whose work is invisible once it is done, because it shows the part the customer paid for and will never see again.", "slots": {"title": "str, 3-6 words", "body": "str, one or two sentences", "photo": "img path, the finished job", "layers": "list of exactly 4 objects: {name: 2-4 words, note: one short line}"}}-->
<section data-sc-act="pin" data-sc-span="2.4">
  <div data-sc-stage class="b-cut-stage">
    <div class="panel b-cut">
      <div class="stack b-cut-copy">
        <h2>{{title}}</h2>
        <p>{{body}}</p>
      </div>
      <div class="b-cut-view">
        <img class="b-cut-photo" src="{{photo}}" alt="">
        <div class="b-cut-plan" data-sc-reveal="left" data-sc-reveal-at="0.22 0.8">
          <ol class="b-cut-list">
            {{#layers}}
            <li><b>{{name}}</b><span>{{note}}</span></li>
            {{/layers}}
          </ol>
        </div>
      </div>
    </div>
  </div>
</section>
<style>
/* The drawing sits ON the photo in one grid cell and is wiped in from the left,
   so the two are the same object at two depths rather than two pictures side by
   side. Its ground is opaque on purpose: a cutaway that lets the photo through
   reads as a double exposure. */
.b-cut-stage{display:flex;align-items:center}
.b-cut-stage > .panel{width:100%}
.b-cut{display:grid;grid-template-columns:minmax(220px,.75fr) 1.25fr;gap:36px;align-items:center}
.b-cut-view{display:grid;border-radius:calc(var(--radius) * .7);overflow:hidden;
  aspect-ratio:4/3}
.b-cut-photo,.b-cut-plan{grid-area:1/1;width:100%;height:100%}
.b-cut-photo{object-fit:cover}
.b-cut-plan{background:color-mix(in oklab, var(--ink) 92%, transparent);
  display:flex;align-items:center;padding:26px 28px}
.b-cut-list{list-style:none;counter-reset:cut;margin:0;padding:0;width:100%}
.b-cut-list li{counter-increment:cut;display:grid;grid-template-columns:auto 1fr;
  column-gap:14px;padding:11px 0;border-bottom:1px solid color-mix(in oklab, var(--panel) 40%, transparent)}
.b-cut-list li::before{content:counter(cut,decimal-leading-zero);grid-row:1/3;
  align-self:center;font-variant-numeric:tabular-nums;font-weight:700;
  color:var(--accent);font-size:15px}
.b-cut-list b{font-family:var(--font-display);font-size:20px;color:var(--panel)}
.b-cut-list span{font-size:calc(var(--body-size) * .85);
  color:color-mix(in oklab, var(--panel) 72%, transparent)}
@media(max-width:820px){.b-cut{grid-template-columns:1fr}}
</style>
