<!--{"kind": "panel", "device": "scrub", "what": "Two photos with a wipe between them, driven by scroll position: the job before and after. The strongest block for trades where the result is visible.", "slots": {"title": "str, 3-6 words", "body": "str, one or two sentences", "before": "img path", "after": "img path", "before_label": "str, 1-2 words", "after_label": "str, 1-2 words"}}-->
<section data-sc-act="pin" data-sc-span="2.2">
  <div data-sc-stage class="panel stack b-ba">
    <h2>{{title}}</h2>
    <p>{{body}}</p>
    <div class="b-ba-frame">
      <img class="b-ba-img" src="{{before}}" alt="">
      <div class="b-ba-top"><img class="b-ba-img" src="{{after}}" alt=""></div>
      <div class="b-ba-handle"></div>
      <span class="b-ba-tag b-ba-tag-l">{{before_label}}</span>
      <span class="b-ba-tag b-ba-tag-r">{{after_label}}</span>
    </div>
  </div>
</section>
<style>
/* The wipe is scroll position, not a drag: nobody drags anything in a recorded
   video, and a slider that never moves is a still photograph. It reads the
   act's own --sc-p rather than re-deriving progress from bounding rects, which
   is what the hand-rolled version did and why it never quite agreed with the
   rest of the page. */
.b-ba{min-height:72vh;display:flex;flex-direction:column;justify-content:center}
.b-ba-frame{position:relative;border-radius:calc(var(--radius) * .7);overflow:hidden;
  aspect-ratio:16/9;background:#000;--wipe:calc(12% + var(--sc-p, 0) * 76%)}
.b-ba-img{width:100%;height:100%;object-fit:cover;border-radius:0;display:block}
.b-ba-top{position:absolute;inset:0;width:var(--wipe);overflow:hidden}
.b-ba-top .b-ba-img{width:100vw;max-width:none;height:100%}
.b-ba-handle{position:absolute;top:0;bottom:0;left:var(--wipe);width:2px;background:var(--accent);
  box-shadow:0 0 24px rgba(0,0,0,.6)}
.b-ba-handle::after{content:"";position:absolute;top:50%;left:50%;width:42px;height:42px;
  transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.b-ba-tag{position:absolute;bottom:14px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(0,0,0,.55);padding:7px 12px;border-radius:999px}
.b-ba-tag-l{left:14px}.b-ba-tag-r{right:14px}
</style>
