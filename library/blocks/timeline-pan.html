<!--{"kind": "panel", "device": "pan", "what": "The history travelling sideways, one stop per year. Lateral movement reads as time passing in a way a vertical list does not, and the years doing the spacing means the quiet decades look quiet.", "slots": {"title": "str, 3-6 words", "stops": "list of 5-7 objects: {year: four digits, head: 2-5 words, note: one short line}"}}-->
<section data-sc-act="pan" data-sc-span="2.4">
  <div data-sc-stage class="b-time-stage">
    <div class="b-time-head bleed"><h2>{{title}}</h2></div>
    <div class="b-time-vp">
      <div class="b-time-rail" data-sc-pan="0.4">
        <span class="b-time-rule" aria-hidden="true"></span>
        {{#stops}}
        <div class="b-time-stop">
          <span class="b-time-dot" aria-hidden="true"></span>
          <div class="b-time-year">{{year}}</div>
          <h3 class="b-time-h">{{head}}</h3>
          <p class="fine">{{note}}</p>
        </div>
        {{/stops}}
      </div>
    </div>
  </div>
</section>
<style>
/* Masked, not cut. A hard edge slices a stop mid-word and reads as a layout
   bug rather than as more history continuing off screen. */
.b-time-stage{display:flex;flex-direction:column;justify-content:center;gap:5vh}
.b-time-head{padding-inline:5vw}
.b-time-head h2{text-shadow:0 2px 34px rgba(0,0,0,.5)}
.b-time-vp{overflow:clip;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.b-time-rail{position:relative;display:flex;gap:26px;padding:38px 5vw 0;width:max-content}
.b-time-rule{position:absolute;left:0;right:0;top:44px;height:1px;background:var(--line)}
.b-time-stop{position:relative;width:250px;flex:0 0 auto;padding-top:24px;
  display:flex;flex-direction:column;gap:7px}
.b-time-dot{position:absolute;top:2px;left:0;width:11px;height:11px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab, var(--accent) 24%, transparent)}
.b-time-year{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.06em;
  color:var(--accent)}
.b-time-h{font-size:22px}
</style>
