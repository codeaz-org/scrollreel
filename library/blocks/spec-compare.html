<!--{"kind": "panel", "device": "stagger", "what": "Two columns set against each other: what the standard requires, what this business actually does. The most persuasive block for a trade whose competitors cut corners.", "slots": {"title": "str, 3-6 words", "left_head": "str, 2-4 words, e.g. 'Minimum standard'", "right_head": "str, 2-4 words, e.g. 'What we fit'", "items": "list of 3-5 objects: {label: what is being compared, left: the minimum, right: theirs}"}}-->
<section>
  <div class="panel stack b-cmp">
    <h2>{{title}}</h2>
    <div class="b-cmp-head">
      <span></span>
      <span class="fine">{{left_head}}</span>
      <span class="fine b-cmp-ours">{{right_head}}</span>
    </div>
    <div class="b-cmp-rows" data-sc-in data-sc-stagger="90">
      {{#items}}
      <div class="b-cmp-row">
        <span class="b-cmp-label">{{label}}</span>
        <span class="b-cmp-left">{{left}}</span>
        <span class="b-cmp-right">{{right}}</span>
      </div>
      {{/items}}
    </div>
  </div>
</section>
<style>
.b-cmp-head,.b-cmp-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;align-items:baseline}
.b-cmp-head{padding-bottom:10px;border-bottom:1px solid var(--line)}
.b-cmp-head span{letter-spacing:.16em;text-transform:uppercase}
.b-cmp-ours{color:var(--accent-panel)}
.b-cmp-row{padding:16px 0;border-bottom:1px solid var(--line)}
.b-cmp-label{font-size:19px}
.b-cmp-left{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.b-cmp-right{font-weight:700;color:var(--ink)}
@media(max-width:760px){.b-cmp-head{display:none}
  .b-cmp-row{grid-template-columns:1fr;gap:4px}
  .b-cmp-left::before{content:"Standard: ";color:var(--muted)}
  .b-cmp-right::before{content:"Ours: ";color:var(--accent-panel)}}
</style>
