<!--{"kind": "panel", "device": "draw", "overlap": true, "what": "A small stamped mark that sits half over the section above it, the way a certification sticker sits on the thing it certifies. Reads as applied to what is above rather than as a claim in its own section, which is the difference between proof and a badge.", "slots": {"mark": "str, 2-4 words, the scheme or standard", "ref": "str, the registration number or year", "line": "str, one short line saying what it covers"}}-->
<section>
  <div class="b-stamp">
    <div class="b-stamp-disc" data-sc-in>
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="b-stamp-ring" cx="60" cy="60" r="54" fill="none"
                stroke="var(--accent)" stroke-width="2" pathLength="100"/>
        <circle cx="60" cy="60" r="44" fill="none" stroke="var(--line)" stroke-width="1"/>
      </svg>
      <span class="b-stamp-ref">{{ref}}</span>
    </div>
    <div class="b-stamp-copy" data-sc-in>
      <div class="b-stamp-mark">{{mark}}</div>
      <p class="fine">{{line}}</p>
    </div>
  </div>
</section>
<style>
/* The ring draws itself on entry over pathLength 100, so the geometry can
   change without retuning the animation. Ranged left and narrow on purpose:
   an overlapping element that spans the full width just looks like a section
   with a shadow on it. */
.b-stamp{display:flex;align-items:center;gap:20px;max-width:440px;margin-left:6%;
  padding:18px 24px 18px 18px;border:1px solid var(--line);
  border-radius:calc(var(--radius) * .7);background:var(--panel)}
.b-stamp-disc{position:relative;width:84px;height:84px;flex:0 0 auto;
  display:grid;place-items:center}
.b-stamp-disc svg{position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg)}
.b-stamp-ring{stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset 1.5s cubic-bezier(.22,.7,.2,1)}
.b-stamp-disc.sc-in .b-stamp-ring{stroke-dashoffset:0}
.b-stamp-ref{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
  letter-spacing:.06em;color:var(--accent-panel);text-align:center;line-height:1.2}
.b-stamp-mark{font-family:var(--font-display);font-size:21px;line-height:1.15}
@media(max-width:760px){.b-stamp{margin-inline:0;max-width:none}}
</style>
