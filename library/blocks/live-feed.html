<!--{"kind": "panel", "device": "stagger", "what": "Recent jobs arriving as a list, newest first, each with a place and a time. Makes the business feel busy and current rather than described.", "slots": {"title": "str, 3-6 words", "note": "str, one short line", "items": "list of 4-6 objects: {when: e.g. '09:20' or 'Tuesday', what: 4-8 words, where: a district or street}"}}-->
<section>
  <div class="panel stack b-feed">
    <div class="b-feed-head">
      <h2>{{title}}</h2>
      <span class="b-feed-live fine"><i></i>Live</span>
    </div>
    <p class="fine">{{note}}</p>
    <ul class="b-feed-list" data-sc-in data-sc-stagger="90">
      {{#items}}
      <li class="b-feed-row">
        <span class="b-feed-when">{{when}}</span>
        <span class="b-feed-what">{{what}}</span>
        <span class="b-feed-where fine">{{where}}</span>
      </li>
      {{/items}}
    </ul>
  </div>
</section>
<style>
.b-feed-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.b-feed-live{display:inline-flex;align-items:center;gap:8px;letter-spacing:.2em;text-transform:uppercase}
.b-feed-live i{width:9px;height:9px;border-radius:50%;background:#3ddc84;
  animation:bFeedPulse 2.4s ease-in-out infinite}
@keyframes bFeedPulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}
  50%{box-shadow:0 0 0 8px rgba(61,220,132,0)}}
.b-feed-list{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.b-feed-row{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:baseline;
  padding:15px 0;border-bottom:1px solid var(--line)}
.b-feed-when{font-variant-numeric:tabular-nums;color:var(--accent-panel);font-weight:700}
.b-feed-what{font-size:19px}
@media(max-width:760px){.b-feed-row{grid-template-columns:74px 1fr}
  .b-feed-where{grid-column:2}}
</style>
