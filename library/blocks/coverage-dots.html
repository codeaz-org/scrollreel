<!--{"kind": "panel", "device": "draw", "what": "A dot field with the covered places lit, so the service area is a shape rather than a sentence. Use instead of service-radius when the coverage is a set of towns rather than a circle.", "slots": {"title": "str, 3-6 words", "note": "str, one short line", "items": "list of 5-9 place names"}}-->
<section>
  <div class="panel stack b-cov">
    <h2>{{title}}</h2>
    <p class="fine">{{note}}</p>
    <div class="b-cov-wrap">
      <div class="b-cov-field" aria-hidden="true" data-sc-in>
        <span class="b-cov-dot" style="--x:18%;--y:22%;--d:0ms"></span>
        <span class="b-cov-dot" style="--x:52%;--y:14%;--d:90ms"></span>
        <span class="b-cov-dot" style="--x:78%;--y:30%;--d:180ms"></span>
        <span class="b-cov-dot" style="--x:34%;--y:46%;--d:120ms"></span>
        <span class="b-cov-dot b-cov-hub" style="--x:50%;--y:52%;--d:0ms"></span>
        <span class="b-cov-dot" style="--x:70%;--y:64%;--d:240ms"></span>
        <span class="b-cov-dot" style="--x:26%;--y:72%;--d:300ms"></span>
        <span class="b-cov-dot" style="--x:60%;--y:84%;--d:360ms"></span>
      </div>
      <div class="b-cov-places" data-sc-in data-sc-stagger="70">
        {{#items}}<span class="b-cov-place">{{.}}</span>{{/items}}
      </div>
    </div>
  </div>
</section>
<style>
.b-cov-wrap{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;margin-top:6px}
.b-cov-field{position:relative;height:280px;border:1px solid var(--line);
  border-radius:calc(var(--radius) * .6);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:22px 22px}
.b-cov-dot{position:absolute;left:var(--x);top:var(--y);width:12px;height:12px;
  border-radius:50%;background:var(--accent);transform:translate(-50%,-50%) scale(0);
  transition:transform .6s var(--sc-ease-out,cubic-bezier(.16,.84,.44,1));
  transition-delay:var(--d)}
.sc-in .b-cov-dot{transform:translate(-50%,-50%) scale(1)}
.b-cov-hub{width:20px;height:20px;box-shadow:0 0 0 6px color-mix(in oklab,var(--accent) 25%,transparent)}
.b-cov-places{display:flex;flex-wrap:wrap;gap:9px}
.b-cov-place{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:17px;
  color:var(--muted)}
@media(max-width:760px){.b-cov-wrap{grid-template-columns:1fr}}
</style>
