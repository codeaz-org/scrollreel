<!--{"kind": "bleed", "device": "kinetic", "what": "A headline with one word that cycles through what the business actually does. Says range in a single line instead of a service list. Alternative opener to hero-statement; never use both.", "slots": {"before": "str, words before the rotating one, e.g. 'We rebuild'", "words": "list of 3-5 single words or short phrases that swap", "after": "str, words after, often empty", "line": "str, one sentence", "cta": "str, 2-4 words"}, "role": "opener"}-->
<section class="hero">
  <div class="bleed b-rot">
    <h1 class="b-rot-h">{{before}}
      <span class="b-rot-slot">
        {{#words}}<span class="b-rot-w">{{.}}</span>{{/words}}
      </span>
      {{after}}</h1>
    <p class="lede b-rot-line">{{line}}</p>
    <a class="b-rot-cta cta" href="#contact">{{cta}}</a>
  </div>
</section>
<style>
/* The swap is a timed loop, not a scroll device, because it has to run while
   the visitor is still reading the first screen and has not scrolled at all. */
.b-rot-h{max-width:16ch}
.b-rot-slot{display:inline-grid;vertical-align:baseline}
.b-rot-w{grid-area:1/1;opacity:0;color:var(--accent);
  animation:bRot 9s infinite;transform:translateY(.22em)}
.b-rot-w:nth-child(1){animation-delay:0s}
.b-rot-w:nth-child(2){animation-delay:2.25s}
.b-rot-w:nth-child(3){animation-delay:4.5s}
.b-rot-w:nth-child(4){animation-delay:6.75s}
.b-rot-w:nth-child(5){animation-delay:9s}
@keyframes bRot{0%{opacity:0;transform:translateY(.22em)}
  4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-.18em)}}
.b-rot-line{max-width:50ch;margin-top:22px}
.b-rot-cta{display:inline-block;margin-top:32px;padding:17px 30px;border-radius:999px;
  background:var(--accent);color:#0b0d10;font-weight:700;text-decoration:none;font-size:19px}
</style>
