<!--{"kind": "panel", "device": "stagger", "what": "What things cost or how long they take, as rows arriving in sequence. Specific numbers are what make a concept site look real; never write 'from POA'.", "slots": {"title": "str, 3-6 words", "note": "str, one short line under the title", "items": "list of 3-6 objects: {name: 2-5 words, detail: one short line, price: e.g. '5.80 EUR' or '48h' or 'from 1,400'}"}}-->
<section>
  <div class="panel stack b-price">
    <h2>{{title}}</h2>
    <p class="fine">{{note}}</p>
    <div class="b-price-rows" data-sc-in data-sc-stagger="80">
      {{#items}}
      <div class="b-price-row">
        <div><div class="b-price-name">{{name}}</div><div class="fine">{{detail}}</div></div>
        <div class="b-price-v">{{price}}</div>
      </div>
      {{/items}}
    </div>
  </div>
</section>
<style>
.b-price-rows{margin-top:10px;border-top:1px solid var(--line)}
.b-price-row{display:flex;justify-content:space-between;align-items:baseline;gap:24px;
  padding:20px 0;border-bottom:1px solid var(--line)}
.b-price-name{font-size:23px;font-weight:600}
.b-price-v{font-family:var(--font-display);font-size:27px;font-weight:800;
  color:var(--accent-panel);white-space:nowrap;font-variant-numeric:tabular-nums}
</style>
