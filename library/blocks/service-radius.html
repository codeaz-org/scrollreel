<!--{"kind": "panel", "device": "draw", "what": "Where they actually work, as rings that expand outward with the places named. Local trades win or lose on 'do you come to me', and this answers it without a map.", "slots": {"title": "str, 3-6 words", "centre": "str, the base town or district", "radius": "str, e.g. '25 km' or '40 minutes'", "items": "list of 4-8 place names they cover"}}-->
<section>
  <div class="panel stack b-radius" data-sc-in>
    <h2>{{title}}</h2>
    <div class="b-radius-wrap">
      <div class="b-radius-rings">
        <span class="b-ring b-ring-3"></span>
        <span class="b-ring b-ring-2"></span>
        <span class="b-ring b-ring-1"></span>
        <span class="b-radius-dot"></span>
        <span class="b-radius-centre fine">{{centre}}</span>
      </div>
      <div class="stack">
        <div class="b-radius-num">{{radius}}</div>
        <div class="fine b-radius-k">Working radius</div>
        <div class="b-radius-places" data-sc-in data-sc-stagger="80">
          {{#items}}<span class="b-radius-place">{{.}}</span>{{/items}}
        </div>
      </div>
    </div>
  </div>
</section>
<style>
/* Rings key off .sc-in, the class the engine adds when the block enters, so
   the block no longer carries an observer of its own. */
.b-radius-wrap{display:grid;grid-template-columns:280px 1fr;gap:30px;align-items:center;margin-top:6px}
.b-radius-rings{position:relative;height:260px;display:grid;place-items:center}
.b-ring{position:absolute;border:1px solid var(--line);border-radius:50%;
  transform:scale(.25);opacity:0;
  transition:transform 1s var(--sc-ease-out,cubic-bezier(.16,.84,.44,1)),opacity .8s ease}
.b-ring-1{width:110px;height:110px}.b-ring-2{width:190px;height:190px}.b-ring-3{width:260px;height:260px}
.sc-in .b-ring,.b-radius.sc-in .b-ring{transform:scale(1);opacity:1}
.sc-in .b-ring-2{transition-delay:.12s}
.sc-in .b-ring-3{transition-delay:.24s;border-style:dashed}
.b-radius-dot{width:13px;height:13px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 6px rgba(255,255,255,.05)}
.b-radius-centre{position:absolute;top:calc(50% + 18px);letter-spacing:.14em;text-transform:uppercase}
.b-radius-num{font-family:var(--font-display);font-size:clamp(44px,5vw,64px);font-weight:800;
  color:var(--accent-panel);letter-spacing:-.03em}
.b-radius-k{letter-spacing:.16em;text-transform:uppercase}
.b-radius-places{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.b-radius-place{border:1px solid var(--line);border-radius:999px;padding:9px 16px;
  font-size:17px;color:var(--muted)}
@media(max-width:760px){.b-radius-wrap{grid-template-columns:1fr}}
</style>
