<!--{"kind": "panel", "device": "draw", "what": "Where they actually work, as expanding rings with the places named. Local trades win or lose on 'do you come to me', and this answers it without a map API.", "slots": {"title": "str, 3-6 words", "centre": "str, the base town or district", "radius": "str, e.g. '25 km' or '40 minutes'", "items": "list of 4-8 place names they cover"}}-->
<section>
  <div class="panel stack b-radius">
    <h2>{{title}}</h2>
    <div class="b-radius-wrap">
      <div class="b-radius-rings">
        <span class="b-ring b-ring-3"></span>
        <span class="b-ring b-ring-2"></span>
        <span class="b-ring b-ring-1"></span>
        <span class="b-radius-dot"></span>
        <span class="b-radius-centre">{{centre}}</span>
      </div>
      <div class="stack">
        <div class="b-radius-num">{{radius}}</div>
        <div class="fine b-radius-k">Working radius</div>
        <div class="b-radius-places">
          {{#items}}<span class="b-radius-place">{{.}}</span>{{/items}}
        </div>
      </div>
    </div>
  </div>
</section>
<style>
.b-radius-wrap{display:grid;grid-template-columns:280px 1fr;gap:30px;align-items:center;margin-top:6px}
.b-radius-rings{position:relative;height:260px;display:grid;place-items:center}
.b-ring{position:absolute;border:1px solid var(--line);border-radius:50%;
  transform:scale(.2);opacity:0;transition:transform 1s cubic-bezier(.16,.84,.44,1),opacity .8s ease}
.b-ring-1{width:110px;height:110px}.b-ring-2{width:190px;height:190px}.b-ring-3{width:260px;height:260px}
.b-radius-rings.on .b-ring{transform:scale(1);opacity:1}
.b-radius-rings.on .b-ring-2{transition-delay:.12s}
.b-radius-rings.on .b-ring-3{transition-delay:.24s;border-style:dashed}
.b-radius-dot{width:13px;height:13px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 6px rgba(255,255,255,.05)}
.b-radius-centre{position:absolute;top:calc(50% + 18px);font-size:16px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.b-radius-num{font-size:clamp(44px,5vw,64px);font-weight:800;color:var(--accent);letter-spacing:-.03em}
.b-radius-k{letter-spacing:.16em;text-transform:uppercase}
.b-radius-places{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.b-radius-place{border:1px solid var(--line);border-radius:999px;padding:9px 16px;
  font-size:17px;color:var(--muted)}
@media(max-width:760px){.b-radius-wrap{grid-template-columns:1fr}}
</style>
<script>
(function(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target);}
  });},{threshold:.4});
  document.querySelectorAll(".b-radius-rings").forEach(function(r){io.observe(r)});
})();
</script>
