<!--{"kind": "panel", "device": "kinetic", "what": "Closing block for a business whose next step is a message rather than a visit: one big line, one field, the phone number underneath for people who would rather ring. Use instead of contact-hours when there is no counter to walk into.", "slots": {"headline": "str, 5-9 words, addressed to the reader", "field_label": "str, 2-4 words, what goes in the box", "cta": "str, 2-3 words on the button", "phone": "str, plausible local format", "reply_note": "str, one line on when they will hear back", "area": "str, one line on where they cover"}, "role": "closer"}-->
<section data-sc-act="pin" data-sc-span="1.6">
  <div data-sc-stage class="panel b-sign">
    <h2 class="b-sign-h" data-sc-cue="0.04 1 0.34 0" data-sc-kinetic="words">{{headline}}</h2>
    <div class="b-sign-form" data-sc-cue="0.36 1 0.4 0">
      <label class="b-sign-field">
        <span class="fine">{{field_label}}</span>
        <input type="text" tabindex="-1" aria-label="{{field_label}}">
      </label>
      <button class="b-sign-btn" type="button" tabindex="-1">{{cta}}</button>
    </div>
    <div class="b-sign-foot" data-sc-cue="0.52 1 0.4 0">
      <a class="b-sign-phone" href="tel:{{phone}}">{{phone}}</a>
      <p class="fine">{{reply_note}}</p>
      <p class="fine">{{area}}</p>
    </div>
  </div>
</section>
<style>
.b-sign{display:flex;flex-direction:column;justify-content:center;gap:30px;min-height:64vh}
.b-sign-h{font-size:clamp(34px,4.6vw,64px);line-height:1.06;max-width:16ch}
.b-sign-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.b-sign-field{flex:1 1 320px;display:flex;flex-direction:column;gap:7px}
.b-sign-field input{background:transparent;border:0;border-bottom:2px solid var(--line);
  color:var(--ink);font:inherit;font-size:calc(var(--body-size) * 1.1);padding:11px 2px}
.b-sign-btn{border:0;border-radius:calc(var(--radius) * .6);background:var(--accent);
  color:#0b0d10;font:inherit;font-weight:700;font-size:calc(var(--body-size) * 1.05);
  padding:15px 28px;cursor:pointer}
.b-sign-foot{display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:22px}
.b-sign-phone{font-family:var(--font-display);font-size:29px;text-decoration:none;
  color:var(--accent-panel)}
</style>
