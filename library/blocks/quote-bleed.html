<!--{"kind": "bleed", "device": "kinetic", "what": "One large line over open backdrop, assembling word by word while the frame holds. Use it to break up panels and let the 3D breathe. Never two in a row.", "slots": {"quote": "str, 6-14 words, a claim or a principle, not a testimonial", "attrib": "str, 2-6 words, e.g. 'Our one guarantee'"}}-->
<section data-sc-act="pin" data-sc-span="1.5">
  <div data-sc-stage class="bleed b-quote">
    <p class="b-quote-t" data-sc-kinetic="words" data-sc-cue="0 0.9 0">{{quote}}</p>
    <div class="b-quote-a fine" data-sc-cue="0.4 0.95">{{attrib}}</div>
  </div>
</section>
<style>
/* Was a bespoke word split with its own observer. The engine does both, and
   its stagger is the same easing as everything else on the page. Span 1.5
   because a pinned act under ~1.2 has a pixel of travel and every cue snaps. */
.b-quote{display:flex;flex-direction:column;justify-content:center;min-height:66vh}
.b-quote-t{font-family:var(--font-display);font-size:clamp(36px,4.6vw,60px);line-height:1.12;
  letter-spacing:var(--track);color:var(--ink);max-width:24ch;font-weight:600;
  text-shadow:0 2px 40px rgba(0,0,0,.6);margin:0}
.b-quote-a{margin-top:22px;letter-spacing:.2em;text-transform:uppercase}
</style>
