<!--{"kind": "panel", "device": "stagger", "what": "A four-cell grid of photos with short labels. Shows breadth of work without a paragraph. Cells arrive one after another.", "slots": {"title": "str, 3-6 words", "items": "list of exactly 4 objects: {img: img path, label: 1-3 words, note: short line}"}}-->
<section>
  <div class="panel stack b-bento">
    <h2>{{title}}</h2>
    <div class="b-bento-grid" data-sc-in data-sc-stagger="80">
      {{#items}}
      <figure class="b-bento-cell">
        <img src="{{img}}" alt="">
        <figcaption><span class="b-bento-label">{{label}}</span><span class="fine">{{note}}</span></figcaption>
      </figure>
      {{/items}}
    </div>
  </div>
</section>
<style>
.b-bento-grid{display:grid;gap:16px;grid-template-columns:1.3fr 1fr;grid-auto-rows:200px;margin-top:6px}
.b-bento-cell{position:relative;margin:0;overflow:hidden;border-radius:calc(var(--radius) * .7)}
.b-bento-cell:nth-child(1){grid-row:span 2}
.b-bento-cell img{width:100%;height:100%;object-fit:cover;border-radius:0;
  transform:scale(1.06);transition:transform 1.4s var(--sc-ease-out,cubic-bezier(.16,.84,.44,1))}
.b-bento-cell.sc-in img{transform:scale(1)}
.b-bento-cell figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px;
  display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(transparent,rgba(0,0,0,.78))}
.b-bento-label{font-weight:700;font-size:21px}
@media(max-width:760px){.b-bento-grid{grid-template-columns:1fr}.b-bento-cell:nth-child(1){grid-row:auto}}
</style>
