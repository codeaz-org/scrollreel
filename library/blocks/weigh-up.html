<!--{"kind": "panel", "device": "pin", "what": "Repair or replace, on a beam that tips as you scroll. The honest version of a sales page: it names the case for spending less, and the tipping is what makes a reader finish reading both sides.", "slots": {"title": "str, 3-6 words", "left_head": "str, 1-3 words, the cheaper option", "left_body": "str, one or two sentences, genuinely arguing FOR it", "right_head": "str, 1-3 words, the bigger job", "right_body": "str, one or two sentences", "verdict": "str, one sentence saying how you decide between them"}}-->
<section data-sc-act="pin" data-sc-span="2.4">
  <div data-sc-stage class="b-weigh-stage">
    <div class="panel stack b-weigh">
      <h2>{{title}}</h2>
      <div class="b-weigh-beam">
        <div class="b-weigh-pan b-weigh-l">
          <h3>{{left_head}}</h3>
          <p class="fine">{{left_body}}</p>
        </div>
        <span class="b-weigh-pivot" aria-hidden="true"></span>
        <div class="b-weigh-pan b-weigh-r">
          <h3>{{right_head}}</h3>
          <p class="fine">{{right_body}}</p>
        </div>
      </div>
      <p class="lede b-weigh-verdict" data-sc-cue="0.55 1 0.3 0">{{verdict}}</p>
    </div>
  </div>
</section>
<style>
/* The tilt is computed from act progress in pure CSS: --sc-p runs 0..1, so
   (p - 0.5) gives a signed value and the beam swings from one side to the other
   and settles level as the verdict arrives. No JS, and it scrubs backwards. */
.b-weigh-stage{display:flex;align-items:center}
.b-weigh-stage > .panel{width:100%}
.b-weigh-beam{--tilt:calc((var(--sc-p, 0.5) - 0.5) * 7deg);
  display:grid;grid-template-columns:1fr auto 1fr;gap:26px;align-items:start;
  padding:22px 0;transform:rotate(var(--tilt));transform-origin:50% 0}
.b-weigh-pan{border:1px solid var(--line);border-radius:calc(var(--radius) * .7);
  padding:24px 22px;background:color-mix(in oklab, var(--ink) 6%, transparent);
  transform:rotate(calc(var(--tilt) * -1))}
.b-weigh-pan h3{margin-bottom:9px}
.b-weigh-pivot{width:2px;align-self:stretch;background:var(--line)}
.b-weigh-verdict{max-width:52ch}
@media(max-width:760px){.b-weigh-beam{grid-template-columns:1fr;transform:none}
  .b-weigh-pan{transform:none}.b-weigh-pivot{display:none}}
</style>
