<!--{"kind":"bleed","what":"Today's status in one line -- open now or not, and until when. Small, live-feeling, and the only block that reads as a real business rather than a brochure.","slots":{"label":"str, 2-4 words, e.g. 'Workshop status'","state":"str, 2-5 words, e.g. 'Open until 17:30'","detail":"str, one short line, e.g. 'Sat by appointment · closed Sunday'"}}-->
<section>
  <div class="bleed b-open">
    <span class="b-open-dot" aria-hidden="true"></span>
    <span class="b-open-l fine">{{label}}</span>
    <span class="b-open-s">{{state}}</span>
    <span class="b-open-d fine">{{detail}}</span>
  </div>
</section>
<style>
.b-open{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:999px;padding:15px 24px;
  background:rgba(9,11,15,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  width:max-content;max-width:100%}
.b-open-dot{width:11px;height:11px;border-radius:50%;background:#3ddc84;flex:0 0 auto;
  animation:bOpenPulse 2.4s ease-in-out infinite}
@keyframes bOpenPulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,132,.45)}
  50%{box-shadow:0 0 0 9px rgba(61,220,132,0)}}
.b-open-l{letter-spacing:.16em;text-transform:uppercase}
.b-open-s{font-size:21px;font-weight:700}
.b-open-d{opacity:.85}
</style>
