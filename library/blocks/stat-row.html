<!--{"kind": "panel", "device": "count", "what": "Three or four numbers that prove the business, counting up when they scroll into view. Use real, specific figures.", "slots": {"items": "list of 3-4 objects: {value: number as string e.g. '1420', suffix: '+' or '%' or 'yrs' or '', label: 2-5 words}"}}-->
<section>
  <div class="panel b-stats">
    {{#items}}
    <div class="b-stat">
      <div class="b-stat-v" data-to="{{value}}" data-suffix="{{suffix}}">0{{suffix}}</div>
      <div class="b-stat-l fine">{{label}}</div>
    </div>
    {{/items}}
  </div>
</section>
<style>
.b-stats{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.b-stat-v{font-size:clamp(42px,5vw,62px);font-weight:800;letter-spacing:-.03em;color:var(--accent);
  font-variant-numeric:tabular-nums}
.b-stat-l{margin-top:8px;text-transform:uppercase;letter-spacing:.14em}
</style>
<script>
(function(){
  // Counts on entry, once. Eased rather than linear so it settles instead of
  // stopping dead on the final number.
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting||e.target.dataset.done)return;
    e.target.dataset.done="1";
    var el=e.target,to=parseFloat(el.dataset.to)||0,sfx=el.dataset.suffix||"",t0=null,dur=1100;
    function step(ts){t0=t0||ts;var p=Math.min(1,(ts-t0)/dur);
      var e2=1-Math.pow(1-p,3);
      el.textContent=Math.round(to*e2).toLocaleString()+sfx;
      if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });},{threshold:.5});
  document.querySelectorAll(".b-stat-v").forEach(function(el){io.observe(el)});
})();
</script>
