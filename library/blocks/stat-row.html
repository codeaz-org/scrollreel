<!--{"kind": "panel", "device": "count", "what": "Three or four numbers that prove the business, counting up as they arrive in sequence. Use figures the business could actually state.", "slots": {"items": "list of 3-4 objects: {value: number as string e.g. '1420', suffix: '+' or '%' or 'yrs' or '', label: 2-5 words}"}}-->
<section>
  <div class="panel b-stats" data-sc-in data-sc-stagger="80">
    {{#items}}
    <div class="b-stat">
      <div class="b-stat-v"><span data-sc-count="0 {{value}}">0</span>{{suffix}}</div>
      <div class="b-stat-l fine">{{label}}</div>
    </div>
    {{/items}}
  </div>
</section>
<style>
/* The counter and the stagger are both the engine's now. This block used to
   run its own rAF loop with its own easing, which is how a page ended up with
   a dozen listeners that almost agreed with each other. */
.b-stats{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.b-stat-v{font-family:var(--font-display);font-size:clamp(42px,5vw,62px);font-weight:800;
  letter-spacing:-.03em;color:var(--accent-panel);font-variant-numeric:tabular-nums}
.b-stat-l{margin-top:8px;text-transform:uppercase;letter-spacing:.14em}
</style>
