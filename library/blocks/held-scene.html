<!--{"kind": "panel", "device": "parallax", "holds": 2, "what": "A photograph that STAYS while the next two sections travel over it. Not a background: it is on screen for a third of the video instead of four seconds, and whatever passes over it is read against it. Use it once, under the two sections that most need a place attached to them.", "slots": {"photo": "img path, a wide shot with room in it, since text will cross it", "label": "str, 2-5 words, where or when", "line": "str, 5-10 words, seen on its own before anything covers it"}}-->
<div class="b-held">
  <img class="b-held-img" src="{{photo}}" alt="" data-sc-parallax="-0.06">
  <div class="b-held-scrim" aria-hidden="true"></div>
</div>
<div data-hold-intro class="b-held-intro">
  <p class="b-held-line">{{line}}</p>
  <span class="b-held-label fine">{{label}}</span>
</div>
<style>
/* Two top-level parts, and they have to be, because they behave differently.
   The first is the bed: blocks.render() puts it in the sticky layer, where it
   is crossed by everything that follows. The second is marked data-hold-intro
   and scrolls away with the first screen, which is the only place it makes
   sense -- left in the sticky layer it sits under the incoming panel for the
   whole hold and two pieces of copy fight for the same pixels.

   No <section> anywhere: this block is a stage, not a band in the flow. */
.b-held{position:relative;width:100%;height:100%;overflow:clip}
.b-held-img{position:absolute;inset:-8% 0;width:100%;height:116%;object-fit:cover;
  max-width:none;border-radius:0}
.b-held-scrim{position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.12) 0%, rgba(0,0,0,.28) 44%,
    rgba(0,0,0,.60) 100%)}
.b-held-intro{position:relative;height:100vh;display:flex;flex-direction:column;
  justify-content:flex-end;gap:12px;padding:0 6vw 13vh;pointer-events:none}
.b-held-line{max-width:20ch;margin:0;font-family:var(--font-display);
  font-size:clamp(30px,4vw,58px);line-height:1.08;color:#f6f7f8;
  text-shadow:0 2px 40px rgba(0,0,0,.6)}
.b-held-label{color:#cfd6dd;letter-spacing:.2em;text-transform:uppercase}
</style>
