<!--{"kind": "panel", "device": "reveal", "what": "One photograph uncovered by a wipe as it scrolls, with a short story beside it. Use for the single best image.", "slots": {"title": "str, 3-6 words", "body": "str, two or three sentences with a concrete detail", "img": "img path", "caption": "str, short, e.g. a street name or a date"}}-->
<section>
  <div class="panel b-reveal" data-sc-in>
    <div class="b-reveal-grid">
      <div class="stack">
        <h2>{{title}}</h2>
        <p>{{body}}</p>
        <div class="fine b-reveal-cap">{{caption}}</div>
      </div>
      <div class="b-reveal-frame"><img src="{{img}}" alt="" data-sc-reveal="left"></div>
    </div>
  </div>
</section>
<style>
/* The wipe is the engine's clip-path device. A fade here would read as a slow
   image load rather than as a change of state. */
.b-reveal-grid{display:grid;gap:28px;grid-template-columns:1fr 1fr;align-items:center}
.b-reveal-frame{overflow:hidden;border-radius:calc(var(--radius) * .7)}
.b-reveal-frame img{width:100%;display:block}
.b-reveal-cap{letter-spacing:.14em;text-transform:uppercase}
@media(max-width:760px){.b-reveal-grid{grid-template-columns:1fr}}
</style>
