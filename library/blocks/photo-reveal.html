<!--{"kind": "panel", "device": "reveal", "what": "One photograph uncovered by a wipe as it scrolls, with a short story beside it. Use for the single best image.", "slots": {"title": "str, 3-6 words", "body": "str, two or three sentences with a concrete detail", "img": "img path", "caption": "str, short, e.g. a street name or a date"}}-->
<section>
  <div class="panel b-reveal">
    <div class="b-reveal-grid">
      <div class="stack">
        <h2>{{title}}</h2>
        <p>{{body}}</p>
        <div class="fine b-reveal-cap">{{caption}}</div>
      </div>
      <div class="b-reveal-frame"><img src="{{img}}" alt=""></div>
    </div>
  </div>
</section>
<style>
.b-reveal-grid{display:grid;gap:28px;grid-template-columns:1fr 1fr;align-items:center}
.b-reveal-frame{overflow:hidden;border-radius:14px}
.b-reveal-frame img{width:100%;display:block;
  /* Wipe, not a fade: a fade reads as a slow image load. */
  clip-path:inset(0 100% 0 0);transform:scale(1.08);
  transition:clip-path 1.1s cubic-bezier(.16,.84,.44,1),transform 1.4s cubic-bezier(.16,.84,.44,1)}
.b-reveal-frame.on img{clip-path:inset(0 0 0 0);transform:scale(1)}
.b-reveal-cap{letter-spacing:.14em;text-transform:uppercase}
@media(max-width:760px){.b-reveal-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target);}
  });},{threshold:.35});
  document.querySelectorAll(".b-reveal-frame").forEach(function(f){io.observe(f)});
})();
</script>
