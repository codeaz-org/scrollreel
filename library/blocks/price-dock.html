<!--{"kind": "panel", "device": "pin", "what": "A quote that builds itself. The total sits pinned on one side while the line items arrive one at a time on the other, so the reader watches the number they will pay being assembled rather than being shown a finished figure to distrust.", "slots": {"title": "str, 3-6 words", "unit": "str, the currency symbol or short prefix, e.g. 'from EUR'", "total": "str, the number only, e.g. '1,480'", "foot": "str, one line on what changes the figure", "items": "list of exactly 4 objects: {head: 2-4 words, note: one short line, cost: e.g. '380'}"}}-->
<section data-sc-act="pin" data-sc-span="2.4">
  <div data-sc-stage class="b-dock-stage">
    <div class="panel b-dock">
      <div class="b-dock-grid">
        <div class="b-dock-total">
          <h2>{{title}}</h2>
          <div class="b-dock-fig">
            <span class="b-dock-unit fine">{{unit}}</span>
            <span class="b-dock-num">{{total}}</span>
          </div>
          <p class="fine">{{foot}}</p>
        </div>
        <ol class="b-dock-list">
          <li data-sc-cue="0.06 1 0.5 0"><b>{{items.0.head}}</b><span>{{items.0.note}}</span><i>{{items.0.cost}}</i></li>
          <li data-sc-cue="0.24 1 0.5 0"><b>{{items.1.head}}</b><span>{{items.1.note}}</span><i>{{items.1.cost}}</i></li>
          <li data-sc-cue="0.42 1 0.5 0"><b>{{items.2.head}}</b><span>{{items.2.note}}</span><i>{{items.2.cost}}</i></li>
          <li data-sc-cue="0.60 1 0.5 0"><b>{{items.3.head}}</b><span>{{items.3.note}}</span><i>{{items.3.cost}}</i></li>
        </ol>
      </div>
    </div>
  </div>
</section>
<style>
.b-dock-stage{display:flex;align-items:center}
.b-dock-stage > .panel{width:100%}
/* The panel sits INSIDE the stage rather than being it: the engine gives a
   stage exactly 100vh, so a card that is the stage is a viewport-tall card
   with its bottom half empty. */
/* Cues are written out per item rather than looped: each one starts later than
   the last and they all hold to the end, which a repeat cannot express. The
   fourth value is a rampOut of 0, because the engine defaults it to 0.3 and a
   quote that fades itself out as you finish reading it is worse than no quote. */
.b-dock-grid{display:grid;grid-template-columns:minmax(230px,.8fr) 1.2fr;gap:44px;
  align-items:start}
.b-dock-fig{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.b-dock-unit{letter-spacing:.14em;text-transform:uppercase}
.b-dock-num{font-family:var(--font-display);font-size:clamp(46px,6vw,86px);line-height:1;
  color:var(--accent-panel);font-variant-numeric:tabular-nums}
.b-dock-list{list-style:none;margin:0;padding:0;counter-reset:d}
.b-dock-list li{display:grid;grid-template-columns:1fr auto;gap:4px 18px;
  padding:18px 0;border-bottom:1px solid var(--line)}
.b-dock-list b{grid-column:1;grid-row:1;font-family:var(--font-display);font-weight:600;
  font-size:22px}
.b-dock-list span{grid-column:1;grid-row:2;font-size:calc(var(--body-size) * .88);
  color:var(--muted)}
.b-dock-list i{grid-column:2;grid-row:1/3;align-self:center;justify-self:end;
  font-style:normal;font-weight:700;
  font-variant-numeric:tabular-nums;font-size:21px}
@media(max-width:820px){.b-dock-grid{grid-template-columns:1fr}
  .b-dock-fig{margin-bottom:8px}}
</style>
