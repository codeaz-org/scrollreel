<!--{"kind": "panel", "device": "pan", "what": "A horizontal rail of past jobs that pans sideways as the page scrolls down. Shows volume of work in one screen; the sideways motion against the vertical scroll is what makes it read as designed.", "slots": {"title": "str, 3-6 words", "items": "list of 4-6 objects: {img: img path, label: 2-4 words, meta: short, e.g. a district or a year}"}}-->
<section>
  <div class="panel stack b-rail">
    <h2>{{title}}</h2>
    <div class="b-rail-vp">
      <div class="b-rail-track">
        {{#items}}
        <figure class="b-rail-card">
          <img src="{{img}}" alt="">
          <figcaption><span class="b-rail-l">{{label}}</span><span class="fine">{{meta}}</span></figcaption>
        </figure>
        {{/items}}
      </div>
    </div>
  </div>
</section>
<style>
.b-rail-vp{overflow:hidden;margin-top:6px;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.b-rail-track{display:flex;gap:18px;width:max-content;will-change:transform}
.b-rail-card{margin:0;width:330px;flex:0 0 auto;position:relative;border-radius:14px;overflow:hidden}
.b-rail-card img{width:100%;height:220px;object-fit:cover;border-radius:0}
.b-rail-card figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px;
  display:flex;flex-direction:column;gap:2px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.b-rail-l{font-weight:700;font-size:20px}
</style>
<script>
(function(){
  // Pans on vertical scroll rather than on a timer, so the sideways motion is
  // tied to the viewer's own movement through the page.
  var vps=[].slice.call(document.querySelectorAll(".b-rail-vp"));
  function tick(){
    vps.forEach(function(vp){
      var track=vp.firstElementChild; if(!track)return;
      var r=vp.getBoundingClientRect();
      var span=Math.max(0,track.scrollWidth-vp.clientWidth);
      var p=1-(r.top+r.height*0.5)/innerHeight;      // 0 entering, 1 leaving
      p=Math.max(0,Math.min(1,(p-0.1)/0.7));
      track.style.transform="translateX("+(-p*span).toFixed(1)+"px)";
    });
  }
  addEventListener("scroll",tick,{passive:true});addEventListener("resize",tick);tick();
})();
</script>
